<script>
  document.getElementById("backgroundButton").style.backgroundColor = "black";

    stateOfColorButtons = "background";

    stateOfColorButtons = "text";

    document.getElementById("backgroundButton").style.backgroundColor = "white";
    document.getElementById("backgroundButton").style.color = "black";
  }

  var myHex;
  var count = 0;

  var colorPicker = new iro.ColorPicker(".colorPicker", {
    // color picker options
    // Option guide: https://iro.js.org/guide.html#color-picker-options
    width: 150,
    borderWidth: 1,
    borderColor: "#fff"
  });

  var values = document.getElementById("values");

  // https://iro.js.org/guide.html#color-picker-events
  colorPicker.on(["color:init", "color:change"], function(color) {
    // Show the current color in different formats
    // Using the selected color: https://iro.js.org/guide.html#selected-color-api
    values.innerHTML = [
      (myHex = color.hexString),
      "hex: " + color.hexString,
      "rgb: " + color.rgbString,
      "hsl: " + color.hslString
    ].join("<br>");
    count = count + 1;
    if (count > 1) {
      updateColors();
    }
  });

  var stateOfColorButtons = "background";

  function updateColors() {
    if (stateOfColorButtons == "background") {
      document.body.style.backgroundColor = myHex;
      document.getElementById(
        "colorPickerButton"
      ).style.backgroundColor = myHex;
      document.getElementById("Progress_Status").style.backgroundColor = myHex;

      localStorage.setItem("1value", myHex);
    } else {
      if (stateOfColorButtons == "text") {
        document.getElementById("timeUntil").style.color = myHex;
        document.getElementById("timeUntil").style.textShadow = "1px 1px 2px" + myHex;
        document.getElementById("timeUntilLabel").style.color = myHex;
        document.getElementById("timeUntilLabel").style.textShadow =  "1px 1px 2px" + myHex;
        document.getElementById("myprogressBar").style.backgroundColor = myHex;

        document.getElementById("progressPercent").style.color = myHex;
        document.getElementById("progressPercent").style.textShadow = "1px 1px 2px" + myHex;
        document.getElementById("colorPickerButton").style.color = myHex;
        document.getElementById("colorPickerButton").style.outline = "1px solid" + myHex;
        document.getElementById("colorPickerButton").style.textShadow =  "1px 1px 2px" + myHex;
        document.getElementById("Progress_Status").style.outline = "1px solid" + myHex;

        localStorage.setItem("2value", myHex);
      }
    }
  }

  // var backCol;
  var textCol;

  function rememberAndPlaceColors() {
    var val1 = localStorage.getItem("1value");
    var val2 = localStorage.getItem("2value");

    document.body.style.backgroundColor = val1;
    document.getElementById("colorPickerButton").style.backgroundColor = val1;
    document.getElementById("Progress_Status").style.backgroundColor = val1;
    document.getElementById("timeUntil").style.color = val2;
    document.getElementById("timeUntilLabel").style.color = val2;
    document.getElementById("colorPickerButton").style.color = val2;
    document.getElementById("colorPickerButton").style.outline =
      "1px solid" + val2;
    document.getElementById("myprogressBar").style.backgroundColor = val2;
    document.getElementById("Progress_Status").style.outline =
      "1px solid" + val2;
    document.getElementById("progressPercent").style.color = val2;
  }
</script>

let canvas = document.getElementById('confetti');

canvas.width = 1500;
canvas.height = 700;

let ctx = canvas.getContext('2d');
let pieces = [];
let numberOfPieces = 50;
let lastUpdateTime = Date.now();

function randomColor () {
    let colors = ['#f00', '#0f0', '#00f', '#0ff', '#f0f', '#ff0'];
    return colors[Math.floor(Math.random() * colors.length)];
}

function update () {
    let now = Date.now(),
        dt = now - lastUpdateTime;

    for (let i = pieces.length - 1; i >= 0; i--) {
        let p = pieces[i];

        if (p.y > canvas.height) {
            pieces.splice(i, 1);
            continue;
        }

        p.y += p.gravity * dt;
        p.rotation += p.rotationSpeed * dt;
    }


    while (pieces.length < numberOfPieces) {
        pieces.push(new Piece(Math.random() * canvas.width, -20));
    }

    lastUpdateTime = now;

    setTimeout(update, 1);
}

function draw () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    pieces.forEach(function (p) {
        ctx.save();

        ctx.fillStyle = p.color;

        ctx.translate(p.x + p.size / 2, p.y + p.size / 2);
        ctx.rotate(p.rotation);

        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);

        ctx.restore();
    });

    requestAnimationFrame(draw);
}

function Piece (x, y) {
    this.x = x;
    this.y = y;
    this.size = (Math.random() * 0.5 + 0.75) * 15;
    this.gravity = (Math.random() * 0.5 + 0.75) * 0.3;
    this.rotation = (Math.PI * 2) * Math.random();
    this.rotationSpeed = (Math.PI * 2) * (Math.random() - 0.5) * 0.001;
    this.color = randomColor();
}

while (pieces.length < numberOfPieces) {
    pieces.push(new Piece(Math.random() * canvas.width, Math.random() * canvas.height));
}

function ifRetired() {
update();
draw();
}
